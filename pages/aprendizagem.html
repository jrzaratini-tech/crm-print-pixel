<!DOCTYPE html>
<html lang="pt"><head><script src="../core/security.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprendizagem - PrintPixel</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}body{margin:0;padding:24px;background:#f8fafc;color:#0f172a}main{max-width:1250px;margin:auto}h1{margin:0;color:#1a237e}.muted{color:#64748b}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-top:18px;box-shadow:0 8px 28px rgba(15,23,42,.05)}table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #e2e8f0;vertical-align:top}th{background:#f1f5f9}.tag{padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:11px;font-weight:800}.eligible{background:#dcfce7;color:#166534}.actions{display:flex;gap:6px;flex-wrap:wrap}button{border:0;border-radius:7px;padding:8px 10px;color:#fff;font-weight:800;cursor:pointer;background:#2563eb}.reject{background:#991b1b}.revert{background:#475569}.wrap{overflow:auto}.history{font-size:12px;color:#475569}#message{font-weight:700}@media(max-width:800px){body{padding:12px}table{min-width:900px}}
</style></head><body data-page-id="aprendizagem" data-page-type="READ"><main><h1>Aprendizagem supervisionada</h1><p class="muted">Compara tempo previsto e realizado. O sistema recomenda; nenhuma regra ou preço é alterado automaticamente.</p><section class="panel"><button id="refresh">ATUALIZAR ANÁLISE</button><p id="message"></p><div class="wrap"><table><thead><tr><th>Família</th><th>Amostra</th><th>Confiança</th><th>Fator sugerido</th><th>Explicação e fontes</th><th>Histórico</th><th>Decisão</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={recommendations:[],approvals:[]};
function render(){const rows=data.recommendations||[];$('rows').innerHTML=rows.length?rows.map(r=>{const history=(data.approvals||[]).filter(a=>a.recommendationId===r.id).sort((a,b)=>b.version-a.version);return `<tr><td><strong>${esc(r.family)}</strong></td><td><span class="tag ${r.eligible?'eligible':''}">${r.sampleSize}/${r.minimumSample}</span></td><td>${esc(r.confidence)}</td><td>${Number(r.recommendedTimeFactor).toFixed(3)}×</td><td>${esc(r.explanation)}<br><span class="history">${r.sourceIds.length} registo(s) rastreável(eis)</span></td><td class="history">${history.length?history.map(h=>`v${h.version} · ${esc(h.action)} · ${esc(h.approvedBy)}`).join('<br>'):'Sem decisão'}</td><td><div class="actions">${r.eligible?`<button onclick="decide('${esc(r.id)}','approve')">Aprovar</button><button class="reject" onclick="decide('${esc(r.id)}','reject')">Rejeitar</button><button class="revert" onclick="decide('${esc(r.id)}','revert')">Reverter</button>`:'Aguardar dados'}</div></td></tr>`}).join('):'<tr><td colspan="7">Ainda não existem trabalhos com tempo previsto e realizado suficientes para análise.</td></tr>'}
async function load(){const response=await fetch('/api/learning/recommendations');data=await response.json();if(!response.ok)throw new Error(data.message);render();$('message').textContent=`${data.recommendations.length} família(s) analisada(s).`}
window.decide=async(id,action)=>{const notes=prompt('Observação para o histórico da decisão:','')??null;if(notes===null)return;const response=await fetch(`/api/learning/recommendations/${encodeURIComponent(id)}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,notes})});const result=await response.json();if(!response.ok){$('message').textContent=result.message;return}await load()};$('refresh').onclick=()=>load().catch(e=>$('message').textContent=e.message);load().catch(e=>$('message').textContent=e.message);
</script></body></html>
